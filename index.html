<!-- AI Chatbot Widget -->
<div id="chatbot-widget">
  <div id="chatbot-header">🤖 AI Assistant</div>
  <div id="chatbot-body">
    <div id="chatbot-messages"></div>
    <input type="text" id="chatbot-input" placeholder="Type your question..." />
  </div>
</div>

<style>
  /* Chatbot Widget Styles */
  #chatbot-widget {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 320px;
    max-height: 400px;
    background: rgba(30, 41, 59, 0.95);
    border-radius: 12px;
    box-shadow: 0 0 20px #38bdf8;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 9999;
    font-family: 'Roboto', sans-serif;
  }
  #chatbot-header {
    background: #38bdf8;
    color: #020617;
    padding: 10px;
    text-align: center;
    font-weight: bold;
    cursor: pointer;
  }
  #chatbot-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 10px;
  }
  #chatbot-messages {
    flex: 1;
    overflow-y: auto;
    margin-bottom: 10px;
  }
  .chatbot-msg { margin: 5px 0; padding: 8px 12px; border-radius: 10px; max-width: 80%; }
  .chatbot-user { background: #38bdf8; color: #020617; align-self: flex-end; }
  .chatbot-bot { background: #1e293b; color: #cbd5f5; align-self: flex-start; }
  #chatbot-input {
    padding: 8px;
    border-radius: 8px;
    border: none;
    outline: none;
    width: 100%;
    background: #0f172a;
    color: white;
  }
</style>

<script>
  // Simple AI Chatbot Logic (replaceable with OpenAI API)
  const chatbotMessages = document.getElementById('chatbot-messages');
  const chatbotInput = document.getElementById('chatbot-input');
  const chatbotHeader = document.getElementById('chatbot-header');

  // Toggle chatbot visibility
  let chatbotOpen = true;
  chatbotHeader.addEventListener('click', () => {
    chatbotOpen = !chatbotOpen;
    document.getElementById('chatbot-body').style.display = chatbotOpen ? 'flex' : 'none';
  });

  // Send message function
  function sendMessage(msg, sender='user'){
    const div = document.createElement('div');
    div.classList.add('chatbot-msg', sender==='user' ? 'chatbot-user':'chatbot-bot');
    div.innerText = msg;
    chatbotMessages.appendChild(div);
    chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
  }

  // Dummy AI responses
  function getBotResponse(msg){
    msg = msg.toLowerCase();
    if(msg.includes('hello') || msg.includes('hi')) return 'Hello! I am your AI assistant. How can I help you today?';
    if(msg.includes('portfolio')) return 'You can explore my projects in the "Artifact Portfolio Projects" section!';
    if(msg.includes('skills')) return 'I have expertise in AI/ML, Full Stack Development, Cloud, and DevOps.';
    if(msg.includes('contact')) return 'You can reach me via email or GitHub in the "Let\'s Connect" section.';
    return 'I am learning more every day! Ask me about AI, ML, or my portfolio.';
  }

  chatbotInput.addEventListener('keypress', (e)=>{
    if(e.key==='Enter' && chatbotInput.value.trim()!==''){
      const userMsg = chatbotInput.value.trim();
      sendMessage(userMsg, 'user');
      chatbotInput.value = '';
      setTimeout(()=>{
        const botReply = getBotResponse(userMsg);
        sendMessage(botReply, 'bot');
      }, 500);
    }
  });
</script>
